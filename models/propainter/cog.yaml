build:
  # Our own Cog wrapper around upstream sczhou/ProPainter, pinned to a commit.
  # The public jd7h/propainter wrapper rejected every Replicate-hosted file:
  # upstream's read_mask/read_frame_from_videos pick "single file" vs
  # "folder" purely by the path's extension, and a Cog download path doesn't
  # reliably keep one. predict.py sidesteps that by converting both inputs
  # into frame folders with ffmpeg before upstream ever sees a filename.
  gpu: true
  cuda: "11.8"
  python_version: "3.10"
  system_packages:
    - "ffmpeg"
    - "libgl1-mesa-glx"
    - "libglib2.0-0"
  # No `av`: upstream only needs it (via torchvision.io.read_video) to read
  # video files directly, and predict.py always passes frame folders. It
  # also has no wheel here and fails to compile without FFmpeg dev headers.
  python_packages:
    - torch==2.0.1
    - torchvision==0.15.2
    - numpy==1.26.4
    - scipy==1.11.4
    - opencv-python==4.9.0.80
    - addict==2.4.0
    - einops==0.7.0
    - future==1.0.0
    - matplotlib==3.8.2
    - scikit-image==0.22.0
    - imageio-ffmpeg==0.4.9
    - pyyaml==6.0.1
    - requests==2.31.0
    - timm==0.9.12
    - yapf==0.40.2
    - pillow==10.2.0
  run:
    - ln -sf $(which python3) /usr/bin/python
    # Absolute /src paths: run: steps execute before cog's WORKDIR /src
    # (same gotcha as models/diffusionclip/cog.yaml).
    - git clone https://github.com/sczhou/ProPainter /src/ProPainter && cd /src/ProPainter && git checkout e870e79321c31b733e2031af5aa2fb1fe3ac7eec
    # Weights baked into the image so setup() never downloads at boot.
    - mkdir -p /src/ProPainter/weights && cd /src/ProPainter/weights && for f in raft-things.pth recurrent_flow_completion.pth ProPainter.pth; do curl -fL -o $f https://github.com/sczhou/ProPainter/releases/download/v0.1.0/$f; done
predict: "predict.py:Predictor"
