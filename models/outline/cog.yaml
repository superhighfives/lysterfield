build:
  gpu: true
  python_version: "3.10"
  python_packages:
    - "setuptools<81"
    - torch==1.12.0
    - torchvision==0.13.0
    - numpy==1.21.5
    - fastai==1.0.61
    - pillow==9.5.0
    - matplotlib==3.7.1
  run:
    # cog 0.22's GPU/CUDA base image only provides `python3`; cog's own
    # tooling (and, per the disabled-version error, Replicate's runtime
    # setup) invokes `python`. Symlink it — fixes "[FATAL tini] exec python
    # failed: No such file or directory" without falling back to
    # --use-cuda-base-image=false, which drops CUDA entirely and is why the
    # first push's version got auto-disabled (setup() needs a real GPU).
    - ln -sf $(which python3) /usr/bin/python
predict: "predict.py:Predictor"
